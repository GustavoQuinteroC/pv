{{/*
  Archivo: login.html
  Qué hace: Pantalla de inicio de sesión: correo y contraseña.
*/}}
{{define "contenido"}}
{{/* Formulario que se envía a /login. */}}
<form method="post" action="/login" class="tarjeta angosta">
  {{/* Nombre del negocio como título. */}}
  <h1>{{.Negocio.Nombre}}</h1>

  <label>Correo
    {{/* Correo; el navegador puede sugerir el guardado. */}}
    <input type="email" name="correo" autocomplete="username" required autofocus>
  </label>

  <label>Contraseña
    {{/* Contraseña oculta. */}}
    <input type="password" name="clave" autocomplete="current-password" required>
  </label>

  <button class="primario">Entrar</button>
</form>
{{end}}
